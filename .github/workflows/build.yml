name: Build APK

on:
  push:
    branches: [master, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Preparar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Notea.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Notea-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: notea-apk
          path: dist/*.apk

      - name: Publicar en Releases (latest)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Notea (ultima compilacion)" --notes "APK generado automaticamente por GitHub Actions. Instala Notea.apk." --target "$GITHUB_SHA"
          gh release upload latest dist/*.apk --clobber
