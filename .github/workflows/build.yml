name: Build APK

on:
  push:
    branches: [master, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Preparar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Notea.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Notea-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: notea-apk
          path: dist/*.apk

      - name: Publicar en Releases (latest)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Notea (última compilación)
          body: "APK generado automáticamente desde ${{ github.sha }}. Instala Notea.apk."
          files: dist/*.apk
          make_latest: true
